    notes: 起動先をapps/SilverHamu.Owner.slnへ変更しOwner README・移行手順・ローカルAGENTSを更新。旧名のソースパスはすべて新名へ移行済み。ソースがないことと作業ツリー内の絶対パスを検証後、旧名ディレクトリ13件とビルド出力765件を削除。過去の計測記録とGit URL、互換性の識別子は維持。
