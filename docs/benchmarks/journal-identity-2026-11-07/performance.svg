<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" role="img"><title>Update latency and throughput under tracing</title><rect width="800" height="365" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#182f45"><text x="24" y="36" font-size="23">Update latency and throughput under tracing</text><text x="24" y="65" font-size="16">Through last response, median run</text><text x="30" y="89" font-size="14">Standard</text><rect x="110" y="75" width="490.00" height="16" fill="#235883"/><text x="609.00" y="89" font-size="14">134.557 updates/s</text><text x="30" y="113" font-size="14">FIFO</text><rect x="110" y="99" width="412.85" height="16" fill="#af562b"/><text x="531.85" y="113" font-size="14">113.373 updates/s</text><text x="24" y="163" font-size="16">Update p99, median run</text><text x="30" y="187" font-size="14">Standard</text><rect x="110" y="173" width="490.00" height="16" fill="#235883"/><text x="609.00" y="187" font-size="14">525.069 ms</text><text x="30" y="211" font-size="14">FIFO</text><rect x="110" y="197" width="176.28" height="16" fill="#af562b"/><text x="295.28" y="211" font-size="14">188.899 ms</text><text x="24" y="261" font-size="16">Worst update across three runs</text><text x="30" y="285" font-size="14">Standard</text><rect x="110" y="271" width="490.00" height="16" fill="#235883"/><text x="609.00" y="285" font-size="14">4,794.001 ms</text><text x="30" y="309" font-size="14">FIFO</text><rect x="110" y="295" width="78.92" height="16" fill="#af562b"/><text x="197.92" y="309" font-size="14">772.129 ms</text></g></svg>