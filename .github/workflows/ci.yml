name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["service,wire-buffer,wire-metrics", "service,inline-key,history-metrics", service, "service,retirement-timing", "service,history-metrics,allocation-metrics,skip-unneeded-history", "service,fixed-log,skip-unneeded-history", "service,history-metrics,allocation-metrics,inline-latest", "service,fixed-log,inline-latest", "service,history-metrics,allocation-metrics", "service,fixed-log", "service,wal-direct", "service,wal-prepare", "service,fixed-log,wal-prepare", "service,single-client-commit,lock-timing,benchmark-metrics", "service,backlog-batch,benchmark-metrics,sync-stall,lock-timing"]
        include:
          - os: ubuntu-latest
            features: service,inline-latest
            cargo_args: --no-default-features
          - os: windows-latest
            features: service,inline-latest
            cargo_args: --no-default-features
          - os: ubuntu-latest
            features: service,fixed-log,history-metrics
            cargo_args: --no-default-features
          - os: windows-latest
            features: service,fixed-log,history-metrics
            cargo_args: --no-default-features
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Subprocess crash fixtures must not overlap other tests' file-lock lifetimes.
      - run: cargo test --locked ${{ matrix.cargo_args }} --features "${{ matrix.features }}" -- --test-threads=1
      - run: cargo build --locked ${{ matrix.cargo_args }} --features "${{ matrix.features }}" --bin catdb-server
      - if: contains(matrix.features, 'lock-timing')
        run: python benchmarks/commit-breakdown/test_diagnostics.py
        env:
          CATDB_DIAGNOSTICS: '1'
      - if: contains(matrix.features, 'lock-timing')
        run: python benchmarks/commit-tail/test_protocol.py
        env:
          CATDB_DIAGNOSTICS: 'pull'
      - run: python benchmarks/backlog-tail/test_analysis.py
      - run: python benchmarks/sync-os/test_analysis.py
      - run: python benchmarks/journal-wait/test_analysis.py
      - run: python benchmarks/request-id/test_analysis.py
      - run: python benchmarks/flush-parent/test_analysis.py
      - run: python benchmarks/storage-stage/test_analysis.py
      - run: python benchmarks/observer-loss/test_analysis.py
      - run: python benchmarks/retirement-timing/test_analysis.py
      - run: python benchmarks/resource-envelope/test_client.py
      - run: python benchmarks/aged-service/test_analysis.py
      - run: python benchmarks/aged-tail/test_analysis.py
      - run: python benchmarks/default-tail/test_audit.py
      - run: python benchmarks/default-tail/test_analysis.py
      - run: python benchmarks/aged-sync/test_analysis.py
      - run: python benchmarks/aged-sync/test_identity.py
      - run: python benchmarks/storage-path/test_paths.py
      - run: python benchmarks/wire-buffer/test_ramp.py
      - if: contains(matrix.features, 'wire-buffer')
        run: python benchmarks/wire-buffer/test_protocol.py WireTests.test_ST_large_then_small_responses_preserve_values WireTests.test_EQ_fragmented_auth_and_coalesced_requests_stay_ordered
      - run: python benchmarks/constrained-backlog/test_client.py
      - run: python benchmarks/constrained-backlog/test_analysis.py
      - if: contains(matrix.features, 'backlog-batch')
        run: python benchmarks/constrained-backlog/test_budget.py BudgetTests.test_ER_global_staged_limit_rejects_whole_unsubmitted_batch_and_recovers
      - if: contains(matrix.features, 'backlog-batch')
        run: python benchmarks/backlog-tail/test_protocol.py
      - run: python benchmarks/backlog/test_schedule.py
      - run: python benchmarks/backlog/test_report.py
      - if: contains(matrix.features, 'backlog-batch')
        run: python benchmarks/backlog/test_protocol.py
      - run: python benchmarks/arrival-rate/test_schedule.py
      - run: python benchmarks/arrival-rate/test_report.py
      - run: python benchmarks/arrival-rate/test_metrics.py
        env:
          CATDB_EXPECT_METRICS: ${{ contains(matrix.features, 'benchmark-metrics') && '1' || '0' }}
      - run: python benchmarks/commit-tail/test_collector.py
      - run: python benchmarks/commit-tail/test_attribution.py
      - run: python benchmarks/inline-qualification/test_fixture.py
      - run: python tests/service_protocol.py
      - if: matrix.features == 'service'
        run: python tests/service_accounts.py
      - if: matrix.features == 'service'
        run: python tests/managed_wal_service.py
      - run: python tests/service_protocol.py
        env:
          CATDB_BACKGROUND_RECLAMATION: '1'
      - if: matrix.features == 'service'
        run: python tests/service_protocol.py
        env:
          CATDB_EXPERIMENTAL_REDO_LOG_BYTES: '16777216'
      - if: contains(matrix.features, 'fixed-log')
        run: python tests/service_protocol.py
        env:
          CATDB_EXPERIMENTAL_FIXED_LOG_BYTES: '16777216'
      - run: cargo build --locked --release ${{ matrix.cargo_args }} --features "${{ matrix.features }}" --lib
      - run: python -m unittest discover -s tests -p "*ffi_checks.py"
      - if: matrix.features == 'service'
        run: cargo build --locked --release --no-default-features --lib --target-dir target/compat-deque
      - if: matrix.features == 'service' && runner.os == 'Linux'
        run: |
          python tests/storage_transition.py target/compat-deque/release/libnewdbms.so target/release/libnewdbms.so
          python tests/key_storage_transition.py target/compat-deque/release/libnewdbms.so target/release/libnewdbms.so
      - if: matrix.features == 'service' && runner.os == 'Windows'
        run: |
          python tests/storage_transition.py target/compat-deque/release/newdbms.dll target/release/newdbms.dll
          python tests/key_storage_transition.py target/compat-deque/release/newdbms.dll target/release/newdbms.dll

      - run: cargo clippy --locked ${{ matrix.cargo_args }} --features "${{ matrix.features }}" --lib --bin catdb-server -- -D warnings
      - if: contains(matrix.features, 'history-metrics')
        run: cargo clippy --locked ${{ matrix.cargo_args }} --features "${{ matrix.features }}" --bin history-capacity-bench -- -D warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t catdb:local .
      - run: python tests/service_container.py
      - run: python benchmarks/managed-wal/run.py --image catdb:local --out artifacts/managed-smoke --clients 4 --keys 256 --passes 5 --epoch 16 --value-bytes 16384
