version: 3
title: catdb
createdAt: 2026-11-09T15:31:25.7166025Z
modifiedAt: 2026-11-09T17:03:16.3841345Z
tasks:
- id: sql-semantic-types
  title: SQLで日時・金額・識別子の意味を保証する
  notes: 基本型と名前付き独自型を使い分ける。異なるIDの比較・代入を拒否し、制約・型情報がSQLの読み書きと保存を通じて保たれることを終了条件とする。
  children:
  - id: sql-semantic-type-design
    title: 独自型の意味と構文を設計する
    estimateHours: 1
    remainingHours: 0
    notes: 型の同一性、CHECK、リテラルの代入、明示的な型変換、演算時の型を整理した。
  - id: sql-semantic-type-engine
    title: 基本型・独自型をSQLエンジンに実装する
    estimateHours: 4
    remainingHours: 0
    notes: UUID、DECIMAL(p,s)、日時と期間、名前付き独自型、CHECK、カタログ、キャストと書き込み検証を実装した。比較・索引・ビュー・結果列にも型を引き継ぐ。FLOAT64、ユーザー定義演算子、DROP TYPE と ALTER TYPE は今回の対象外。
  - id: sql-semantic-type-verification
    title: 型の保証を検証し、利用例を文書化する
    estimateHours: 2
    remainingHours: 0
    notes: Visual Studio 2026 の Debug ビルド成功。SQLテストはTRXで160件中160件成功。CLIで文書の例を実行し、ネイティブDBを作成後に再オープンした結果、金額1200をJpyAmount型で取得し、数値の合計1200を確認した。
- id: sql-distinct-addition
  title: 名前付き数値型の加算をSQLで有効にする
  notes: 同じ独自型の2つの値を加算して同じ型の結果を得られること、混在した型や結果の制約違反を拒否できることを終了条件とする。
  children:
  - id: sql-distinct-addition-engine
    title: ALTER TYPE による加算の有効化と式評価を実装する
    estimateHours: 2
    remainingHours: 0
    notes: ALTER TYPE ... ENABLE OPERATOR + で名前付き数値型の加算を有効にする。式評価と型推論で結果の独自型を保ち、精度・範囲・CHECKを検証する。
  - id: sql-distinct-addition-verification
    title: 加算の成功・拒否条件をテストし、SQLの使用例を文書化する
    estimateHours: 1
    remainingHours: 0
    notes: Visual Studio 2026 の Debug ビルド成功。TRXでSQLテスト179件中179件成功。CLIで実DBを再オープンし、日本語列の SELECT カラム１＋カラム２ が円型の1100を返した。加算が有効でない型、異通貨、範囲と精度の超過、CHECK違反、ロールバックも検証した。
- id: app-view-token-access
  title: 閲覧用アプリの公開ビュー限定アクセスと権限取消を検証する
  estimateHours: 1
  remainingHours: 0
  notes: 閲覧専用ロールトークンの設定手順を文書化。実TCPで許可ビューのSELECTと、原表・非公開ビュー・生KVのget/scanの拒否を確認した。同じ接続でREVOKE直後の読み取りは拒否、再付与後は成功。CIの既存プロトコルテストに追加。
- id: sql-costed-planning
  title: 複合結合条件とコストに基づく実行計画をSQLで利用できるようにする
  notes: VS 2026 Debugビルド成功、SQLテスト199/199。実DBで複合LEFT JOINの結果とEXPLAIN表示を確認。ANALYZE後の値の偏りによる索引・表走査の切替、結合順と方式の変更、古い統計からの復帰を検証。READMEのFeature matrixとSQL syntax matrixを更新。
  children:
  - id: sql-join-on-and
    title: ANDで結ぶ複数のJOIN条件を評価する
    estimateHours: 2
    remainingHours: 0
  - id: sql-costed-access-joins
    title: 読み取り方法と結合順を推定コストで選択する
    estimateHours: 4
    remainingHours: 0
  - id: sql-explain-costed
    title: EXPLAINで計画を表示し、動作検証とREADME更新を行う
    estimateHours: 3
    remainingHours: 0
- id: sql-explain-runtime
  title: EXPLAIN ANALYZEで推定と実測を比較できるようにする
  estimateHours: 5
  remainingHours: 0
  notes: SELECT・WITHの実行を計測し、推定行数、実測行数、ループ数、1回あたりの行数、累積経過時間を表示。実DBで推定2行・実測4行の走査と相関サブクエリ4回を確認した。VS 2026 Debugビルド成功、SQLテスト210件全件成功。READMEのSQL syntax matrixと利用例を更新。
- id: owner-folder-explain
  title: Ownerのフォルダー閲覧でBook_3の統計・計画・実測を確認する
  estimateHours: 4
  remainingHours: 0
  notes: Ownerの実際のフォルダー閲覧でBook_3のANALYZE・EXPLAIN・EXPLAIN ANALYZEが成功。全20979行から1600行を調査し、PublishDate条件で16840行を読んで10行を返した。統計はセッション内のみ。通常DBフォルダー・分割書庫の非変更と再オープン時の統計破棄を自動検証。VS Debugビルド成功、SQLテスト219件全件成功。
