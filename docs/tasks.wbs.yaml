    notes: 表上部と右クリックに行追加・選択行削除を追加。部分セル・複数行の選択も行に集約。追加行は緑・+番号、削除予定行は赤・取り消し線・−番号で表示し、削除予定行は編集不可。必須値不足を表示して実行を無効にする。空の追加行は編集中でも削除して取消可能。Undo／Redo、SQL欄のINSERT・DELETE削除、タブ保持に連動。追記SQLの2行目以降が描画されない問題を実画面で発見し、ネイティブTextBoxを複数行設定しCRLFで反映して修正。
