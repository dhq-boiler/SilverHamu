name: Publish Ruby client to RubyGems
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in silverhamu-client.gemspec
        required: true
        type: string
      sha256:
        description: SHA-256 of the tested gem (leave empty to build only)
        required: false
        type: string

permissions: {}

concurrency:
  group: publish-silverhamu-ruby-client
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  EXPECTED_SHA: ${{ inputs.sha256 }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag and inputs
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+([.][0-9A-Za-z]+)*$ ]]
          [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          release_commit=$(git rev-parse --verify "refs/tags/clients/ruby/v${RELEASE_VERSION}^{commit}")
          git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"
          git checkout --detach "$release_commit"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4.9'
          rubygems: '3.6.9'
          bundler: none
      - name: Build and verify the gem
        working-directory: clients/ruby
        env:
          SOURCE_DATE_EPOCH: '0'
          TZ: UTC
        run: |
          test "$(gem --version)" = 3.6.9
          umask 022
          mkdir -p "$GITHUB_WORKSPACE/dist"
          package="$GITHUB_WORKSPACE/dist/silverhamu-client-$RELEASE_VERSION.gem"
          gem build --strict silverhamu-client.gemspec --output "$package"
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(ARGV.fetch(0)).spec
            abort "unexpected gem" unless spec.name == "silverhamu-client" && spec.version.to_s == ENV.fetch("RELEASE_VERSION")
          ' "$package"
          sha256sum "$package" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$EXPECTED_SHA" ]]; then
            echo "$EXPECTED_SHA  $package" | sha256sum --check --strict
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-distribution
          path: dist/silverhamu-client-${{ inputs.version }}.gem
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: rubygems
      url: https://rubygems.org/gems/silverhamu-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ruby-distribution
          path: dist
      - name: Verify the downloaded gem and check for an existing release
        id: registry
        run: |
          echo "$EXPECTED_SHA  dist/silverhamu-client-$RELEASE_VERSION.gem" | sha256sum --check --strict
          url="https://rubygems.org/api/v2/rubygems/silverhamu-client/versions/$RELEASE_VERSION.json?platform=ruby"
          status="$(curl --silent --show-error --output version.json --write-out '%{http_code}' "$url")"
          case "$status" in
            200) jq -e --arg sha "$EXPECTED_SHA" '.sha == $sha and .yanked == false' version.json > /dev/null ;;
            404) echo 'push=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "RubyGems returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Publish the verified gem as its registered owner
        if: steps.registry.outputs.push == 'true'
        env:
          RUBYGEMS_OWNER_ID: '237738'
        shell: python
        run: |
          import json
          import os
          import subprocess
          from urllib.request import Request, urlopen

          registry = "https://rubygems.org"
          identity_request = Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=rubygems.org",
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urlopen(identity_request, timeout=30) as response:
              jwt = json.load(response)["value"]

          # The v2.1.0 credentials action omits the owner required for a gem's first push.
          exchange = Request(
              registry + "/api/v1/oidc/trusted_publisher/exchange_token",
              data=json.dumps({"jwt": jwt, "owner": os.environ["RUBYGEMS_OWNER_ID"]}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          with urlopen(exchange, timeout=30) as response:
              key = json.load(response)["rubygems_api_key"]

          gem_file = "dist/silverhamu-client-" + os.environ["RELEASE_VERSION"] + ".gem"
          subprocess.run(["gem", "push", "--host", registry, gem_file],
                         env={**os.environ, "GEM_HOST_API_KEY": key}, check=True)
