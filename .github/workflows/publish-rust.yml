name: Publish Rust client to crates.io
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in clients/rust/Cargo.toml and Cargo.lock
        required: true
        type: string
      publish:
        description: Publish after validation (false builds and verifies only)
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-silverhamu-rust-client
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'dhq-boiler/SilverHamu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Validate release metadata and release checks
        run: |
          python scripts/rust-client-release.py metadata --version "$RELEASE_VERSION"
          python -m unittest discover -s tests -p test_rust_client_release.py
      - name: Check formatting, tests and Clippy
        run: |
          cargo fmt --manifest-path clients/rust/Cargo.toml -- --check
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          cargo clippy --locked --manifest-path clients/rust/Cargo.toml --all-targets -- -D warnings
      - name: Verify token and TLS interoperability
        run: |
          cargo build --locked --features service --bin silverhamu-server
          cargo build --locked --manifest-path clients/rust/Cargo.toml --example smoke
          python tests/language_clients.py --clients rust
      - name: Package and dry-run without publishing credentials
        id: package
        run: |
          cargo publish --dry-run --locked --manifest-path clients/rust/Cargo.toml
          package="clients/rust/target/package/silverhamu-client-$RELEASE_VERSION.crate"
          python scripts/rust-client-release.py package --version "$RELEASE_VERSION" --package "$package"
          sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf 'Rust client %s\nCommit: %s\nSHA-256: %s\n' "$RELEASE_VERSION" "$GITHUB_SHA" "$sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-distribution
          path: clients/rust/target/package/silverhamu-client-${{ inputs.version }}.crate
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/silverhamu-client
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.89.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-distribution
          path: dist
      - name: Verify the tested artifact and existing registry version
        id: registry
        run: |
          python scripts/rust-client-release.py registry --version "$RELEASE_VERSION" \
            --package "dist/silverhamu-client-$RELEASE_VERSION.crate" --expected-sha "$EXPECTED_SHA"
      - name: Reproduce the tested package before authentication
        if: steps.registry.outputs.publish == 'true'
        run: |
          cargo publish --dry-run --locked --manifest-path clients/rust/Cargo.toml
          python scripts/rust-client-release.py package --version "$RELEASE_VERSION" \
            --package "clients/rust/target/package/silverhamu-client-$RELEASE_VERSION.crate" --expected-sha "$EXPECTED_SHA"
      - name: Get a short-lived crates.io token
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified client
        if: steps.registry.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io --manifest-path clients/rust/Cargo.toml
      - name: Verify the registry checksum
        run: |
          python scripts/rust-client-release.py registry --version "$RELEASE_VERSION" \
            --package "dist/silverhamu-client-$RELEASE_VERSION.crate" --expected-sha "$EXPECTED_SHA" --require-published
