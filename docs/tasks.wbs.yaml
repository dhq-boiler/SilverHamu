    notes: Go・npm・PyPI・RubyGems・Maven Centralの0.2.0を公開取得確認済み。npm・Python・Rubyは公開パッケージで実TCP/TLS・トランザクション・認証拒否が成功。PyPIの5テストも成功。JavaはCentral上の4成果物が検証済みバイト列と一致し、公開鍵CADB74EB9FC1DD21A8B3A9B7005CE62130C96F71で全署名を検証（Actions 42992548344、deployment ddd0ed94-fd85-440e-b416-8f0c2723ee8f）。NuGetはActions 42989049653成功・サーバー受理済み、公開フィードは未反映で所有者向け検証状態を先生へ確認中。GitHub Release clients/v0.2.0に成果物・署名・公開鍵・ハッシュを配布。重複した旧CI9本を中止し配布待ちを解消、最新版CIは維持。残作業はNuGetの取得・内容一致確認。サーバー待ち時間は不明。画面操作は行わずCLIとActionsのみ使用。
