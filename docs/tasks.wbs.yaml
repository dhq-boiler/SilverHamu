    notes: VS 2026ビルド成功、SQLテスト253件（TRX確認）、Rustテスト229件、Python wheelとテスト5件、サービス23件＋SQLホスト統合1件成功。Python・Node.js・Ruby・.NET SDKの実TCP/TLS・認証拒否成功。旧catdbのDBとCATDBBAKバックアップをSilverHamuで読み込み確認。Markdownリンクとgit diff --check確認。Go・Javaはツールチェーン不在で実行未確認。
  - id: silverhamu-owner-loading-gif
    title: 提供された回し車GIFをOwnerの処理中表示へ組み込む
