name: Release SilverHamu
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag
        required: true
        default: v0.2.0
        type: string

      ref:
        description: Commit, branch, or tag to build
        required: true
        default: main
        type: string
      publish:
        description: Publish only when the tag already points to the verified source
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            extension: .tar.gz
          - os: windows-latest
            platform: windows-x64
            extension: .zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/package-release.py check
      - name: Test native storage and service
        run: cargo test --locked --features service --lib --tests -- --test-threads=1
      - name: Build native binaries
        run: cargo build --locked --release --features service --lib --bin silverhamu --bin silverhamu-server
      - name: Test replication with the release service
        env:
          CATDB_SERVER: ${{ github.workspace }}/target/release/silverhamu-server${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/replication.py
      - name: Test native ABI
        run: python -m unittest discover -s tests -p "*ffi_checks.py"
      - name: Test SQL and Owner services
        if: runner.os == 'Windows'
        run: dotnet test apps/SilverHamu.Owner.Sql.Tests/SilverHamu.Owner.Sql.Tests.csproj --configuration Release --logger trx
      - name: Publish SQL host
        shell: bash
        run: |
          rid=linux-x64
          if [[ "$RUNNER_OS" == Windows ]]; then rid=win-x64; fi
          dotnet publish dotnet/SilverHamu.Sql.Host/SilverHamu.Sql.Host.csproj -c Release -r "$rid" --self-contained true -o artifacts/release/host
      - name: Build self-contained Windows Owner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw 'MAUI installation failed' }
          dotnet publish apps/SilverHamu.Owner/SilverHamu.Owner.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/release/owner
          if ($LASTEXITCODE -ne 0) { throw 'Owner publish failed' }
          $process = Start-Process artifacts/release/owner/SilverHamu.Owner.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Owner exited during startup with $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Package binaries
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/package-release.py package
      - name: Inventory and scan service and SQL host
        uses: ./.github/actions/scan-sbom
        with:
          name: silverhamu-${{ inputs.tag }}-${{ matrix.platform }}${{ matrix.extension }}
          target: dir:artifacts/release/core-${{ matrix.platform }}
      - name: Inventory and scan Windows Owner
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.package.outcome == 'success' }}
        uses: ./.github/actions/scan-sbom
        with:
          name: silverhamu-owner-${{ inputs.tag }}-windows-x64.zip
          target: dir:artifacts/release/owner
      - name: Include inventories in release downloads
        shell: python
        run: |
          from pathlib import Path
          import shutil
          for pattern in ['*.syft.json', '*.cdx.json']:
              for inventory in Path('artifacts/security').glob(pattern):
                  shutil.copy2(inventory, Path('artifacts/release/downloads') / inventory.name)
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ runner.os }}
          path: artifacts/release/downloads/*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify image
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/package-release.py check
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          docker build -t "silverhamu:$version" .
          docker run --rm --entrypoint /bin/sh "silverhamu:$version" -c 'test -x /usr/local/bin/silverhamu-server && test -x /usr/local/bin/silverhamu && test "$(id -u)" = 10001'
          python tests/service_container.py --image "silverhamu:$version"
      - name: Inventory and scan the runtime image
        uses: ./.github/actions/scan-sbom
        with:
          name: silverhamu-${{ inputs.tag }}-linux-amd64-docker.tar.gz
          target: docker:silverhamu:${{ steps.image.outputs.version }}
      - name: Export image and inventories
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p artifacts/release/downloads
          docker save "silverhamu:$version" | gzip > "artifacts/release/downloads/silverhamu-$version-linux-amd64-docker.tar.gz"
          for format in syft cdx; do
            cp "artifacts/security/silverhamu-$RELEASE_TAG-linux-amd64-docker.tar.gz.$format.json" "artifacts/release/downloads/silverhamu-$version-linux-amd64-docker.tar.gz.$format.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: artifacts/release/downloads/*
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [binaries, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release/downloads
          merge-multiple: true
      - name: Verify complete downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/package-release.py check
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          python scripts/package-release.py checksums
          gh release create "$RELEASE_TAG" artifacts/release/downloads/* --verify-tag --latest --title "SilverHamu $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
