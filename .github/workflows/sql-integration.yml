name: SQL integration
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  windows-sql:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CATDB_SERVER: ${{ github.workspace }}/target/release/catdb-server.exe
      CATDB_SQL_HOST: ${{ github.workspace }}/dotnet/Catdb.Sql.Host/bin/Release/net10.0/Catdb.Sql.Host.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the native library and service
        run: cargo build --locked --release --features service --lib --bin catdb-server
      - name: Build the SQL host
        run: dotnet build dotnet/Catdb.Sql.Host/Catdb.Sql.Host.csproj --configuration Release
      - name: Test the SQL engine and embedded storage
        run: dotnet test apps/Catdb.Owner.Sql.Tests/Catdb.Owner.Sql.Tests.csproj --configuration Release
      - name: Test SQL transactions and view grants over TCP
        run: python tests/service_protocol.py ServiceTests.test_sql_host_and_view_token ServiceTests.test_for_update_excludes_another_writer_until_transaction_end
      - name: Test SQL with TLS account permissions and multiple databases
        run: python tests/service_accounts.py AccountsTest.test_sql_uses_selected_database_admin_grant
