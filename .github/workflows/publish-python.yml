name: Publish Python client to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-silverhamu-service-client
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build the wheel from the source distribution and check both archives
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the installed wheel and requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/consumer/bin/python" -I -c 'import os; from importlib.metadata import version; assert version("silverhamu-service-client") == os.environ["RELEASE_VERSION"]'
          "$RUNNER_TEMP/consumer/bin/python" -I clients/python/test_client.py
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/silverhamu-service-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
