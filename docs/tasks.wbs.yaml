- id: owner-folder-writes
  title: フォルダー内の通常DBと書庫の更新・トランザクション・表編集をサポートする
  notes: 通常SQL DBは対象ファイルへ直接接続し、明示トランザクションは1つの物理DB内に限定して別DB更新を拒否する。書庫は元セグメントを破壊せず新セグメントを作り、library.ndbの目録を1トランザクションで切り替え、既存PALV形式を維持する。未確定変更は照会と表編集に見え、COMMIT／ROLLBACKとSAVEPOINTに対応する。読み取りだけなら元ファイルを変更しない。Kudaki MCP未公開・停止中のfallback記録で次回起動時に再反映する。
  children:
  - id: owner-folder-writes-storage
    title: 通常DBの書込接続と書庫の段階変更・原子的目録更新を実装する
    estimateHours: 5
    remainingHours: 0
    notes: 通常DBは元ファイルへの遅延書込接続とネイティブトランザクションを使用。書庫は変更行を段階保持し、新規セグメント作成後に目録を原子的に切替。UPDATEは対象セグメント、INSERTは追加セグメント、DELETEは連続行番号で再保存。競合目録の上書き拒否と確定成否不明時の再実行防止を実装。旧セグメントは既存読込接続のため保持。
  - id: owner-folder-writes-ui
    title: トランザクション操作・編集メニュー・SQL実行と再取得を接続する
    estimateHours: 2
    remainingHours: 0
    notes: フォルダーでBEGIN／COMMIT／ROLLBACKと1000行／全行編集を有効化。編集SQL・行追加削除複製・RETURNING・SAVEPOINTを既存の一括実行に接続。全行編集の暗黙4096行制限を除去し、更新・確定・取消後は他の編集タブを再取得必須にして古い状態での操作を防止。
  - id: owner-folder-writes-verification
    title: 永続化・全巻戻し・競合・再開と実画面での編集を確認する
