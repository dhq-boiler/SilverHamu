  notes: 単一・複合主キー、列のUNIQUE、複合・部分UNIQUE索引の参加列をNULLへクリアし、他列の現在値を複製。NOT NULL列は既存の必須入力で実行を止める。フォルダー閲覧は一時コピーまたは書庫の読取経路であり更新接続・トランザクションを持たないことを確認して説明する。フォルダーの更新対応は今回変更しない。Kudaki MCP未公開・停止中のfallback記録で次回起動時に再反映する。
