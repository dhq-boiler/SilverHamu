name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: [service, "service,fixed-log", "service,wal-direct", "service,wal-prepare", "service,fixed-log,wal-prepare", "service,single-client-commit,lock-timing,benchmark-metrics", "service,backlog-batch,benchmark-metrics,sync-stall,lock-timing"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Subprocess crash fixtures must not overlap other tests' file-lock lifetimes.
      - run: cargo test --locked --features "${{ matrix.features }}" -- --test-threads=1
      - run: cargo build --locked --features "${{ matrix.features }}" --bin catdb-server
      - if: contains(matrix.features, 'lock-timing')
        run: python benchmarks/commit-breakdown/test_diagnostics.py
        env:
          CATDB_DIAGNOSTICS: '1'
      - if: contains(matrix.features, 'lock-timing')
        run: python benchmarks/commit-tail/test_protocol.py
        env:
          CATDB_DIAGNOSTICS: 'pull'
      - run: python benchmarks/backlog-tail/test_analysis.py
      - run: python benchmarks/sync-os/test_analysis.py
      - run: python benchmarks/journal-wait/test_analysis.py
      - run: python benchmarks/request-id/test_analysis.py
      - if: contains(matrix.features, 'backlog-batch')
        run: python benchmarks/backlog-tail/test_protocol.py
      - run: python benchmarks/backlog/test_schedule.py
      - run: python benchmarks/backlog/test_report.py
      - if: contains(matrix.features, 'backlog-batch')
        run: python benchmarks/backlog/test_protocol.py
      - run: python benchmarks/arrival-rate/test_schedule.py
      - run: python benchmarks/arrival-rate/test_report.py
      - run: python benchmarks/arrival-rate/test_metrics.py
        env:
          CATDB_EXPECT_METRICS: ${{ contains(matrix.features, 'benchmark-metrics') && '1' || '0' }}
      - run: python benchmarks/commit-tail/test_collector.py
      - run: python benchmarks/commit-tail/test_attribution.py
      - run: python tests/service_protocol.py
      - run: python tests/service_protocol.py
        env:
          CATDB_BACKGROUND_RECLAMATION: '1'
      - if: contains(matrix.features, 'fixed-log')
        run: python tests/service_protocol.py
        env:
          CATDB_EXPERIMENTAL_FIXED_LOG_BYTES: '16777216'
      - run: cargo build --locked --release --features "${{ matrix.features }}" --lib
      - run: python -m unittest discover -s tests -p "*ffi_checks.py"
      - run: cargo clippy --locked --features "${{ matrix.features }}" --lib --bin catdb-server -- -D warnings
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t catdb:local .
      - run: python tests/service_container.py
