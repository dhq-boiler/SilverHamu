    estimateHours: 0.75
    remainingHours: 0
    notes: VS 2026 Debugビルド成功、更新した既存テストと追加3ケースを含む全607テスト成功をTRXで確認。複合主キー・列UNIQUE・複合と部分UNIQUE索引の全参加列をクリアし、通常索引列と一般列を保持。UNIQUEの既定値を複製せず、NOT NULLキーは入力必須、NULL可のUNIQUE列はNULLのまま一括実行できること、元の未反映主キー変更は元行に保持して複製側だけクリア、Undo／Redoで未入力値が再現することを検証。vs-mcp UIAで専用verify.ndbのEditUiCasesを複製し、idとUNIQUE NOT NULLのtitleがNULLでINSERTへ入り空のセル入力欄と必須表示、他のamount123.45・activeTRUE・空文字・BLOBが保持され実行無効であることを確認。id30だけ入力後も無効、titleへ新しい値を入れると有効になり、一括実行・再取得・未反映0を確認。既存ユーザーデータは変更していない。
