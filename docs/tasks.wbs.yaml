    notes: DownloadsのハムスターGIFを元データのままリソースへ追加。処理中のみ表示・再生し、完了とエラーで停止・非表示にする。Windowsのアニメーション設定を尊重し、停止中も処理中の文字を表示する。実UIで再生と完了復帰を確認する。ユーザー指定により右上ではなく画面中央へ配置。ファイル選択の入力待ちには重ねず、操作を妨げない。完了。元GIFのSHA256一致、ビルドと実画面の中央160px表示を確認。応答を6秒遅延させたSELECTで処理中表示と操作抑止、正常終了・エラー時の非表示と操作復帰を確認。ファイル選択欄が操作可能で、入力待ちにはGIFが出ないことも確認。
