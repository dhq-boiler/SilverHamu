- id: owner-staged-row-insert-delete
  title: 結果表の行追加・削除をSQLと履歴に積み一括反映する
  notes: 追加行はセル入力しINSERTを更新、既存行はDELETEを追記し削除予定表示で保持。追加未反映行の削除はINSERT取消。Undo・RedoとSQL削除による巻戻し、必須値未入力時の実行禁止、混在DMLの原子的実行を扱う。Kudaki MCP未公開・停止中のfallbackで記録し次回起動時に再反映する。
  children:
  - id: owner-staged-row-model
    title: 行識別・INSERTとDELETEの生成・SQL再構成と一括実行を実装する
    estimateHours: 2.5
    remainingHours: 0
    notes: 行に安定した識別を持たせ、追加行INSERT内の番号コメントと表の+番号を対応。既定値と必須入力を持つ追加行のセル編集は同じINSERTを更新し、追加予定行の削除はINSERTを取消。既存行DELETEは現在の値でWHEREとRETURNINGを生成し、先行UPDATEのSQL削除時はDELETEも再構成。手入力INSERT・DELETEはSQLエンジンの型評価を使ってプレビューし、単一行の同じテーブルへのINSERT・UPDATE・DELETEのみ原子的に一括実行する。
