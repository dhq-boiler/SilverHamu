    title: キー判定・値クリア・フォーカスと日英文言を更新する
    estimateHours: 0.75
    remainingHours: 0
    notes: IsUniqueColumnで列PRIMARY KEY・UNIQUE、CompositePrimaryKey、Unique索引のColumnNamesを大小文字非区別に集約。複製した配列の該当値だけNULLに置換し元行・通常索引列・他列の型付き値を保持。フォーカスも同じ判定を使い、必須セル検証へ接続。日英ツールチップとREADMEを変更。フォルダー側はCatlinkFolder.ExecuteAsyncの読取SQL限定、ReadSqlCopyAsyncの一時コピー、書庫専用走査とMainPageのfolder条件によるボタン／編集メニュー禁止を確認し説明済み。更新実装は変更していない。
