services:
  silverhamu:
    build: .
    image: silverhamu:local
    ports:
      - "127.0.0.1:7400:7400"
    volumes:
      - silverhamu-data:/data
    secrets:
      - silverhamu_token
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped
secrets:
  silverhamu_token:
    file: .secrets/silverhamu-token
volumes:
  silverhamu-data:
