<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 272" role="img"><title>Where the previous elapsed-time difference accumulated</title><rect width="100%" height="100%" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#19334a"><text x="20" y="32" text-anchor="start" font-size="23">Where the previous elapsed-time difference accumulated</text><text x="20" y="57" text-anchor="start" font-size="14">16 ms minus current lock, seconds per 16,384 updates. Positive values mean more elapsed time.</text><text x="22" y="93" text-anchor="start" font-size="15">Elapsed through last response</text><path d="M172 107v117" stroke="#8396a2"/><text x="22" y="128" text-anchor="start" font-size="13">Pair 1</text><rect x="172" y="116" width="99.99999999999999" height="14" fill="#8e5c31"/><text x="279" y="128" text-anchor="start" font-size="13">+47.607</text><text x="22" y="165" text-anchor="start" font-size="13">Pair 2</text><rect x="121.78547804633936" y="153" width="50.214521953660636" height="14" fill="#426786"/><text x="279" y="165" text-anchor="start" font-size="13">-23.906</text><text x="22" y="202" text-anchor="start" font-size="13">Pair 3</text><rect x="79.36534727799994" y="190" width="92.63465272200006" height="14" fill="#426786"/><text x="279" y="202" text-anchor="start" font-size="13">-44.100</text><text x="362" y="93" text-anchor="start" font-size="15">WAL sync</text><path d="M512 107v117" stroke="#8396a2"/><text x="362" y="128" text-anchor="start" font-size="13">Pair 1</text><rect x="512" y="116" width="100.0" height="14" fill="#8e5c31"/><text x="619" y="128" text-anchor="start" font-size="13">+46.348</text><text x="362" y="165" text-anchor="start" font-size="13">Pair 2</text><rect x="459.6856841321206" y="153" width="52.314315867879394" height="14" fill="#426786"/><text x="619" y="165" text-anchor="start" font-size="13">-24.247</text><text x="362" y="202" text-anchor="start" font-size="13">Pair 3</text><rect x="417.25898909661913" y="190" width="94.74101090338085" height="14" fill="#426786"/><text x="619" y="202" text-anchor="start" font-size="13">-43.911</text><text x="702" y="93" text-anchor="start" font-size="15">Contended handoff envelope</text><path d="M852 107v117" stroke="#8396a2"/><text x="702" y="128" text-anchor="start" font-size="13">Pair 1</text><rect x="852" y="116" width="100.0" height="14" fill="#8e5c31"/><text x="959" y="128" text-anchor="start" font-size="13">+0.344</text><text x="702" y="165" text-anchor="start" font-size="13">Pair 2</text><rect x="852" y="153" width="68.61792222685163" height="14" fill="#8e5c31"/><text x="959" y="165" text-anchor="start" font-size="13">+0.236</text><text x="702" y="202" text-anchor="start" font-size="13">Pair 3</text><rect x="852" y="190" width="54.333937337285285" height="14" fill="#8e5c31"/><text x="959" y="202" text-anchor="start" font-size="13">+0.187</text><text x="20" y="251" text-anchor="start" font-size="13">Each panel uses its own scale. The handoff envelope includes release and rescheduling around admission.</text></g></svg>